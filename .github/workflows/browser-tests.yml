# Cross-browser tests: the same Playwright suite (tests/) in Chromium, Firefox
# and WebKit (Safari's engine), desktop, phone and iPad. Same matrix as Sinless's
# workflow, plus PHP and MySQL because this app has a server. See tests/README.md.
name: Browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Playwright's own image, with every browser and the system libraries they need already in it. Installing WebKit's
    # ~100 Ubuntu packages on the runner depended on the runners' apt mirror, which at times served them so slowly
    # that the webkit, mobile-safari and ipad jobs ran out of time. The tag must match @playwright/test in
    # tests/package.json (the first step checks).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false          # one engine failing must not hide another's result
      matrix:
        project: [chromium, firefox, webkit, mobile-safari, mobile-chrome, ipad]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: mysql            # the service's name on the job's network
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci
      DB_NAME: chronicle_test
      HOME: /root               # Firefox won't start as root with a HOME owned by someone else
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - name: Image matches @playwright/test
        run: |
          want=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')
          test "$want" = "1.56.1" || { echo "::error::tests/package-lock.json has @playwright/test $want; set the container image to v$want-noble"; exit 1; }
      # PHP and the MySQL client, from Ubuntu's own archive: a few MB, where WebKit's libraries were hundreds.
      - name: Install PHP and the MySQL client
        timeout-minutes: 6
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30";' > /etc/apt/apt.conf.d/80-retries
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            php8.3-cli php8.3-mysql php8.3-curl php8.3-mbstring php8.3-xml mysql-client-core-8.0
      - run: find ../api ../install.php ../tests/support -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm ci
      - run: |   # TEMPORARY (PR #129): log memory every 20s to find what fills it before the WebKit runners are killed
          (while sleep 20; do echo "MEM $(date +%T) $(free -m | awk 'NR==2{print "used="$3"MB avail="$7"MB"}') top: $(ps -eo rss=,comm= --sort=-rss | head -4 | awk '{printf "%s=%dMB ", $2, $1/1024}')"; done) &
          npx playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.project }}
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 14
