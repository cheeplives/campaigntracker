# Cross-browser tests: the same Playwright suite (tests/) in Chromium, Firefox
# and WebKit (Safari's engine), desktop, phone and iPad. Same matrix as Sinless's
# workflow, plus PHP and MySQL because this app has a server. See tests/README.md.
name: Browser tests

# A push to a pull request's branch already runs as the pull request (against main merged in), so pushes run on their
# own only on main: running both doubled every job and showed each failure twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Each project is split across runners with Playwright's --shard: on one runner each, the iPad took 21 minutes,
    # the iPhone 17, WebKit 15, Firefox 12.5, Chromium 10 and the Pixel 8.5, plus about 2 minutes of setup, so the
    # run took as long as the iPad. Split as below, each runner has about 4 to 9 minutes of tests (shards split by test
    # count, not time, so they come out uneven: the shard holding the map tests is the long one). Every test still
    # runs in every project: a project's shards together are the whole suite. The "Browser tests" job sums them up.
    # Two workers per runner: the runners have 4 cores and the tests are CPU-bound, so 4 workers made every test
    # slower and brought out timing races for little gain; more runners is the faster way.
    name: ${{ matrix.project }}${{ matrix.php != '8.3' && format(' (PHP {0})', matrix.php) || '' }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Playwright's own image, with every browser and the system libraries they need already in it. Installing WebKit's
    # ~100 Ubuntu packages on the runner depended on the runners' apt mirror, which at times served them so slowly
    # that the webkit, mobile-safari and ipad jobs ran out of time. The tag must match @playwright/test in
    # tests/package.json (the first step checks).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false          # one engine failing must not hide another's result
      # One row per runner (16 of the 20 a free account runs at once). The slower engines get more shards. PHP 8.5,
      # the newest PHP the server may move to, runs once with Chromium: the server side doesn't change with the browser.
      matrix:
        include:
          - { project: chromium, php: '8.3', shard: 1, of: 2 }
          - { project: chromium, php: '8.3', shard: 2, of: 2 }
          - { project: chromium, php: '8.5', shard: 1, of: 2 }
          - { project: chromium, php: '8.5', shard: 2, of: 2 }
          - { project: firefox, php: '8.3', shard: 1, of: 2 }
          - { project: firefox, php: '8.3', shard: 2, of: 2 }
          - { project: webkit, php: '8.3', shard: 1, of: 3 }
          - { project: webkit, php: '8.3', shard: 2, of: 3 }
          - { project: webkit, php: '8.3', shard: 3, of: 3 }
          - { project: mobile-safari, php: '8.3', shard: 1, of: 2 }
          - { project: mobile-safari, php: '8.3', shard: 2, of: 2 }
          - { project: mobile-chrome, php: '8.3', shard: 1, of: 2 }
          - { project: mobile-chrome, php: '8.3', shard: 2, of: 2 }
          - { project: ipad, php: '8.3', shard: 1, of: 3 }
          - { project: ipad, php: '8.3', shard: 2, of: 3 }
          - { project: ipad, php: '8.3', shard: 3, of: 3 }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: mysql            # the service's name on the job's network
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci
      DB_NAME: chronicle_test
      HOME: /root               # Firefox won't start as root with a HOME owned by someone else
      PHP: ${{ matrix.php }}
      # Where the test server (tests/playwright.config.js) writes PHP's warnings, checked after the run.
      PHP_ERROR_LOG: /tmp/php-errors.log
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - name: Image matches @playwright/test
        run: |
          want=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')
          test "$want" = "1.56.1" || { echo "::error::tests/package-lock.json has @playwright/test $want; set the container image to v$want-noble"; exit 1; }
      # PHP and the MySQL client, from Ubuntu's own archive: a few MB, where WebKit's libraries were hundreds.
      # Ubuntu 24.04 ships PHP 8.3 only; a newer PHP comes from Ondřej Surý's PPA, the usual source of PHP on Ubuntu.
      # Only Ubuntu's main component (where PHP 8.3 and every package it needs live), and not the image's Node.js
      # repository: the full set of package lists was some 35 MB, and with 16 runners fetching it at once the archive
      # served it slowly enough to time a runner out. main alone is about 5 MB. The PPA's PHP may need universe too.
      - name: Install PHP ${{ matrix.php }} and the MySQL client
        timeout-minutes: 8
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30";' > /etc/apt/apt.conf.d/80-retries
          components=main; [ "$PHP" = "8.3" ] || components="main universe"
          mkdir -p /etc/apt/sources.list.d.off
          find /etc/apt/sources.list.d -type f -exec mv {} /etc/apt/sources.list.d.off/ \;
          printf 'deb http://archive.ubuntu.com/ubuntu noble %s\ndeb http://archive.ubuntu.com/ubuntu noble-updates %s\ndeb http://security.ubuntu.com/ubuntu noble-security %s\n' \
            "$components" "$components" "$components" > /etc/apt/sources.list
          apt-get update -q
          if [ "$PHP" != "8.3" ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl
            mkdir -p /etc/apt/keyrings
            # The PPA's signing key: the copy kept in this repository, so an outage at Ubuntu's key server (one failed
            # every PHP 8.5 job in November 2026) can't stop the run. Without that copy it is fetched, from the key
            # server or else from Launchpad itself, and printed so it can be kept.
            key=/etc/apt/keyrings/ondrej-php.asc
            if [ -s "$GITHUB_WORKSPACE/.github/ondrej-php.asc" ]; then
              cp "$GITHUB_WORKSPACE/.github/ondrej-php.asc" "$key"
            else
              curl -fsSL --retry 2 --connect-timeout 20 -m 60 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x14AA40EC0831756756D7F66C4F4EA0AAE5267A6C' -o "$key" \
                || curl -fsSL --retry 2 --connect-timeout 20 -m 60 'https://api.launchpad.net/1.0/~ondrej/+archive/ubuntu/php?ws.op=getSigningKeyData' \
                  | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)))' > "$key"
              grep -q 'BEGIN PGP PUBLIC KEY BLOCK' "$key" || { echo "::error::The PHP PPA's signing key could not be fetched"; exit 1; }
              cat "$key"
            fi
            echo 'deb [signed-by=/etc/apt/keyrings/ondrej-php.asc] https://ppa.launchpadcontent.net/ondrej/php/ubuntu noble main' > /etc/apt/sources.list.d/ondrej-php.list
            apt-get update -q
          fi
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            php$PHP-cli php$PHP-mysql php$PHP-curl php$PHP-mbstring php$PHP-xml mysql-client-core-8.0
          php -v
          php -r 'exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === getenv("PHP") ? 0 : 1);' || { echo "::error::php -v is not PHP $PHP"; exit 1; }
      - run: find ../api ../install.php ../tools ../tests/support -name '*.php' -print0 | xargs -0 -n1 php -l
      # The upgrade deploy.sh runs: on an empty database it makes every table, then finds nothing left to do.
      - name: Database upgrade from the command line
        env:
          CHRONICLE_CONFIG: support/config.test.php
        run: |
          mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -p"$DB_PASSWORD" -e "DROP DATABASE IF EXISTS $DB_NAME; CREATE DATABASE $DB_NAME CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          php ../tools/migrate.php --no-backup
          php ../tools/migrate.php --check
      - run: npm ci
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.of }}
      # A deprecation today is an error in the next PHP: none may be logged while the tests use the app.
      - name: No PHP deprecations or fatal errors
        if: always()
        run: |
          touch "$PHP_ERROR_LOG"
          if grep -E 'PHP (Deprecated|Fatal error)' "$PHP_ERROR_LOG"; then echo "::error::PHP $PHP logged the lines above"; exit 1; fi
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: report-${{ matrix.project }}-php${{ matrix.php }}-${{ matrix.shard }}of${{ matrix.of }}
          path: |
            tests/playwright-report/
            tests/test-results/
            /tmp/php-errors.log
          retention-days: 14

  # One check that is green only when every shard of every project passed: the name to require in branch protection,
  # since the shard jobs' names change whenever the shard counts do.
  summary:
    name: Browser tests
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success || { echo "::error::A browser test job ended ${{ needs.test.result }}"; exit 1; }
