<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign Chronicle: offline</title>
  <meta name="theme-color" content="#16140f">
  <link rel="icon" href="static/icons/favicon.svg" type="image/svg+xml">
  <!-- Shown by sw.js when the app is opened with no connection. Self-contained: the stylesheet and fonts aren't cached. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16140f; color: #ece4d2; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    main { max-width: 26rem; padding: 24px 16px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.4rem; margin: 12px 0 4px; }
    p { color: #a39a85; margin: 0 0 18px; }
    a { display: inline-block; padding: 8px 18px; border-radius: 6px; background: #d9a441; color: #1a1408; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="static/icons/favicon.svg" alt="">
    <h1>You're offline</h1>
    <p>Campaign Chronicle keeps your campaigns on the server, so it needs a connection. Reconnect and try again.</p>
    <a href="./">Try again</a>
  </main>
</body>
</html>
